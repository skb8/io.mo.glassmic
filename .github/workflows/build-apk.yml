name: Build release APK (optional signing)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Build in the source repository and this fork, never in the module mirror.
    if: github.repository != 'Xposed-Modules-Repo/io.mo.glassmic'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: 检出本次提交
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: 配置 Java 17 和 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: |
            17
            21
          cache: gradle

      - name: 配置 Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: 安装项目要求的 SDK 和原生工具链
        run: sdkmanager "platforms;android-35" "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1" "ndk;26.1.10909125"

      - name: 编译诊断检查类及 Release 安装包
        run: bash ./gradlew :app:compileDebugKotlin :xposed:compileDebugKotlin :app:assembleRelease --no-daemon --console=plain

      - name: 执行音频与回调时序回归检查
        run: |
          set -euo pipefail
          stdlib=$(find "$HOME/.gradle/caches/modules-2/files-2.1/org.jetbrains.kotlin/kotlin-stdlib" -name 'kotlin-stdlib-*.jar' ! -name '*sources*' ! -name '*javadoc*' | sort -V | tail -1)
          test -n "$stdlib"
          mkdir -p build/audio-regression
          classpath="app/build/tmp/kotlin-classes/debug:xposed/build/tmp/kotlin-classes/debug:$stdlib:build/audio-regression"
          javac -encoding UTF-8 -cp "$classpath" -d build/audio-regression tests/audio/AudioRegression.java tests/audio/TapTimingRegression.java
          java -cp "$classpath" AudioRegression
          java -cp "$classpath" TapTimingRegression

      - name: Prepare aligned unsigned APK
        run: |
          set -euo pipefail
          version=$(python3 -c 'import json; print(json.load(open("app/build/outputs/apk/release/output-metadata.json"))["elements"][0]["versionName"])')
          mkdir -p dist
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -P 16 -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "dist/GlassMic-$version-release-unsigned.apk"

      # Configure these four repository Actions secrets to enable persistent release signing.
      # Never commit a keystore or generate an ephemeral release key on each build.
      - name: Sign APK when signing secrets are available
        id: signing
        continue-on-error: true
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_KEYSTORE_PASSWORD" || -z "$ANDROID_KEY_ALIAS" || -z "$ANDROID_KEY_PASSWORD" ]]; then
            echo "::warning::Signing secrets are missing or incomplete; publishing an unsigned APK."
            exit 0
          fi
          umask 077
          signing_dir=$(mktemp -d "$RUNNER_TEMP/glassmic-signing-XXXXXX")
          trap 'rm -rf "$signing_dir"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$signing_dir/release.keystore"
          tools="$ANDROID_HOME/build-tools/36.0.0"
          unsigned_apk=$(find dist -name '*-unsigned.apk' -print -quit)
          apk="${unsigned_apk%-unsigned.apk}.apk"
          "$tools/apksigner" sign --ks "$signing_dir/release.keystore" --ks-key-alias "$ANDROID_KEY_ALIAS" --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD --v4-signing-enabled false --out "$signing_dir/signed.apk" "$unsigned_apk"
          "$tools/apksigner" verify --verbose --print-certs "$signing_dir/signed.apk" > "$signing_dir/signature.txt"
          "$tools/zipalign" -c -P 16 4 "$signing_dir/signed.apk"
          cp "$signing_dir/signature.txt" dist/signature.txt
          mv "$signing_dir/signed.apk" "$apk"
          rm "$unsigned_apk"

      - name: Record build and signing status
        env:
          SIGNING_OUTCOME: ${{ steps.signing.outcome }}
        run: |
          set -euo pipefail
          signing=unsigned
          if [[ -f dist/signature.txt ]]; then signing=signed; fi
          if [[ "$SIGNING_OUTCOME" == failure ]]; then
            echo "::warning::Signing failed; the aligned unsigned APK is available instead."
          fi
          version=$(python3 -c 'import json; print(json.load(open("app/build/outputs/apk/release/output-metadata.json"))["elements"][0]["versionName"])')
          version_code=$(python3 -c 'import json; print(json.load(open("app/build/outputs/apk/release/output-metadata.json"))["elements"][0]["versionCode"])')
          (cd dist && sha256sum ./*.apk > SHA256SUMS.txt)
          printf 'versionName=%s\nversionCode=%s\ncommit=%s\nsigning=%s\nworkflow=%s/%s/actions/runs/%s\n' "$version" "$version_code" "$GITHUB_SHA" "$signing" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > dist/build-info.txt
          echo "### Release APK: $signing" >> "$GITHUB_STEP_SUMMARY"
          cat dist/build-info.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release APK and checksums
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: GlassMic-release-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
